<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/styles/section-contatc.css">

<body>
    <section class="section-contact">
        <div class="container-contact">
            <div class="content-contact">
                <h2>Get in Touch</h2>
                <p>Have a question or a project in mind? I'd love to hear from you. Let's chat and make something amazing together.</p>
            </div>

            <div class="contact-js-design">
                <div class="js-design">
                    <div class="contact">
                        <img src="./src/image/bxs_phone-call.svg" alt=" phone call image">
                        <div class="js-design">
                            <p>+1205 5872 321</p>
                        </div>
                    </div>
                    <div class="contact">
                        <img src="./src/image/ic_sharp-email.svg" alt="Email image">
                        <div class="js-design">
                            <p>contact@sarajonesdesign.com</p>
                        </div>
                    </div>
                    <div class="contact">
                        <img src="./src/image/carbon_location-filled.svg" alt="filder image">
                        <div class="js-design">
                            <p>1234 Design Street,Creativeville, Webland,Imaginary State, 98765</p>
                        </div>
                    </div>
                </div>
                <div class="social-midia">
                    <a href=""><img src="./src/image/Group 1000001749.svg" alt=""></a>
                    <a href=""><img src="./src/image/Group 1000001750 (1).svg" alt=""></a>
                    <a href=""><img src="./src/image/Frame 110.svg" alt=""></a>
                    <a href=""><img src="./src/image/Frame 109.svg" alt=""></a>
                </div>
            </div>
        </div>
        <div class="conatiner-email">
            <input type="text" placeholder="First name" required>
            <input type="text" placeholder="Email" required>
            <input type="text" placeholder="Phone number" required>

            <div class="active-email">
                <input type="text" placeholder="Your message" required>
            </div>

            <div class="send">
                <a href="">Send Message</a>
            </div>
        </div>
    </section>
</body>
</html>
